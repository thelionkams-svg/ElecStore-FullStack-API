<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الفئات - ElecStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>

<body>

    <div id="navbar-placeholder"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="page-title">قائمة الفئات (Categories)</h2>
            <button id="btnAddCategory" class="btn btn-elec-primary">+ إضافة فئة</button>
        </div>

        <div class="card-panel">
            <table class="table table-bordered align-middle" id="categoriesTable">
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>الاسم</th>
                        <th>الوصف</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- بتتملى تلقائياً من categories.js -->
                </tbody>
            </table>
        </div>
    </div>


    <!-- Modal إضافة/تعديل فئة -->
    <div class="modal fade" id="categoryModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <form id="categoryForm">

                    <div class="modal-header">
                        <h5 class="modal-title" id="categoryModalTitle">إضافة فئة جديدة</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" id="categoryId">

                        <div class="mb-3">
                            <label class="form-label">اسم الفئة</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الوصف</label>
                            <textarea class="form-control" id="categoryDescription"></textarea>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                        <button type="submit" class="btn btn-elec-primary">حفظ</button>
                    </div>

                </form>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/categories.js"></script>

</body>
</html>
