<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الفواتير - ElecStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>

<body>

    <div id="navbar-placeholder"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center">
            <h2 class="page-title">فاتورة بيع جديدة</h2>
            <div>
                <span class="badge bg-dark fs-6" id="currentSaleLabel">...</span>
                <button id="btnNewInvoice" class="btn btn-outline-secondary btn-sm ms-2">فاتورة جديدة</button>
            </div>
        </div>

        <div class="row g-4">

            <!-- عمود اختيار المنتج -->

            <div class="col-md-5">

                <div class="card-panel">

                    <h5 class="mb-3">إضافة صنف للفاتورة</h5>

                    <form id="addItemForm">

                        <div class="mb-3">
                            <label class="form-label">المنتج</label>
                            <select class="form-select" id="saleProduct" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الكمية</label>
                            <input type="number" class="form-control" id="saleQuantity" value="1" min="1" required>
                        </div>

                        <button type="submit" class="btn btn-elec-primary w-100">+ إضافة للفاتورة</button>

                    </form>
               
                </div>

            </div>


            <!-- عمود الفاتورة الحالية (Live Cart) -->

            <div class="col-md-7">

                <div class="card-panel">

                    <h5 class="mb-3">الفاتورة الحالية</h5>

                    <table class="table table-bordered align-middle" id="cartTable">
                       
                        <thead>
                            <tr>
                                <th>المنتج</th>
                                <th>الكمية</th>
                                <th>سعر الوحدة</th>
                                <th>الإجمالي</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- بتتملى تلقائياً من sales.js -->
                        </tbody>
                    
                    </table>
                    
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="cart-total">الإجمالي: <span id="cartTotal">0</span> ج.م</span>
                        <button class="btn btn-success" onclick="alert('تم تسجيل الفاتورة بنجاح رقم #' + currentSaleID)">تأكيد وإنهاء الفاتورة</button>
                    </div>
                      
                </div>
           
            </div>
       
        </div>
   
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/sales.js"></script>
</body>
</html>
