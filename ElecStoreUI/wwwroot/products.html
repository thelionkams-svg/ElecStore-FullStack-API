<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المنتجات - ElecStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>

<body>

    <div id="navbar-placeholder"></div>

    <div class="container">
    
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="page-title">قائمة المنتجات (Products)</h2>
            <button id="btnAddProduct" class="btn btn-elec-primary">+ إضافة منتج</button>
        </div>

        <div class="card-panel">
            <table class="table table-bordered align-middle" id="productsTable">
                <thead>
                    <tr>
                        <th>الرقم</th>
                        <th>الاسم</th>
                        <th>الفئة</th>
                        <th>السعر</th>
                        <th>الكمية بالمخزون</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- بتتملى تلقائياً من products.js -->
                </tbody>
            </table>
        </div>
    
    </div>

    <!-- Modal إضافة/تعديل منتج -->

    <div class="modal fade" id="productModal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <form id="productForm">

                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalTitle">إضافة منتج جديد</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">

                        <input type="hidden" id="productId">

                        <div class="mb-3">
                            <label class="form-label">اسم المنتج</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">الفئة</label>
                            <select class="form-select" id="productCategory" required></select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">السعر</label>
                            <input type="number" step="0.01" min="0" class="form-control" id="productPrice" required>
                        </div>
                       
                        <div class="mb-3">
                            <label class="form-label">الكمية بالمخزون</label>
                            <input type="number" min="0" class="form-control" id="productQuantity" required>
                        </div>

                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                        <button type="submit" class="btn btn-elec-primary">حفظ</button>
                    </div>
                
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
